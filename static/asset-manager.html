<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>绱犳潗搴撶鐞?/title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.06.6"></script>
    <script src="/static/js/theme.js?v=2026.08.06.6"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.06.6">
    <link rel="stylesheet" href="/static/css/asset-manager.css?v=2026.08.06.6">
</head>
<body>
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">绱犳潗搴撶鐞?/div>
                <div class="asset-sub">鎸夊簱銆佸垎缁勩€佸唴瀹瑰拰棰勮绠＄悊绱犳潗涓庢彁绀鸿瘝銆?/div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">鍑嗗灏辩华</div>
                <button id="openFolderBtn" class="asset-btn" type="button" title="鎵撳紑鏂囦欢澶?><i data-lucide="folder-open"></i><span>鎵撳紑鏂囦欢澶?/span></button>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>鍒锋柊</span></button>
            </div>
        </header>

        <div class="asset-tabs">
            <button id="assetTabAssets" class="active" type="button" data-tab="assets"><i data-lucide="image"></i><span>鍥剧墖璧勪骇</span></button>
            <button id="assetTabWorkflows" type="button" data-tab="workflows"><i data-lucide="workflow"></i><span>宸ヤ綔娴佺鐞?/span></button>
            <button id="assetTabPrompts" type="button" data-tab="prompts"><i data-lucide="text-cursor-input"></i><span>鎻愮ず璇嶅簱</span></button>

            <button id="assetTabLocal" type="button" data-tab="local"><i data-lucide="folder-open"></i><span>鏈湴绱犳潗</span></button>
        </div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.json,.zip,application/json,application/zip" multiple hidden>
    <script src="/static/js/asset-manager.js?v=2026.08.06.6"></script>
</body>
</html>
