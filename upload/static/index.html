<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>AI Studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.08.06.6"></script>
    <script src="/static/js/theme.js?v=2026.08.06.6"></script>
    <script src="/static/js/i18n.js?v=2026.08.06.6"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.08.06.6');

        /* 鏈湴 Tailwind 宸ュ叿绫诲厹搴曪細CDN 鎱?鏈氨缁椂涔熻兘绔嬪埢缁欏浘鏍囧昂瀵革紝閬垮厤棣栧睆宸︿晶鏍忕┖鐧?*/
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: rgba(0, 0, 0, 0.1);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.15);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
        }

        /* 鏋佺畝婊氬姩鏉?*/
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* ===== 椤堕儴妯潯 ===== */
        .topbar {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px 0 18px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            z-index: 50;
            gap: 8px;
            transition: background 0.3s, border-color 0.3s;
        }

        html:not(.studio-route-booting) .topbar {
            animation: topbar-enter 0.4s var(--fluid-ease);
        }

        @keyframes topbar-enter {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        .logo-ring { margin-right: 6px; }

        .topbar-nav {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            flex-shrink: 0;
        }

        .topbar-nav:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .topbar-nav.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .topbar-nav.active,
        body.theme-dark .topbar-nav.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .topbar-nav svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            flex-shrink: 0;
            position: relative;
        }

        .topbar-btn:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .topbar-btn svg {
            width: 18px;
            height: 18px;
        }

        .topbar-btn.has-update::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 2px var(--sidebar-bg);
        }

        .topbar-lang {
            padding: 0 10px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .topbar-version {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* update badge on version label (inside settings modal) */
        .version-label.update-available {
            color: #22c55e;
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
            /* 浠呬繚鐣?hover 鐪熸浼氱敤鍒扮殑灞炴€ц繃娓★紝閬垮厤 transition: all 鍥犻灞忓睘鎬цˉ榻愯鎰忓瑙﹀彂 */
            transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s, box-shadow .2s;
        }

        .topbar:hover .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: scale(1.8);
        }

        .logo-ring:active {
            transform: scale(.94);
            transition-delay: 0s;
        }

        .topbar:hover .logo-ring:active {
            transform: rotate(90deg) scale(.94);
        }

        #logo-dot {
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        /* 涓昏垶鍙板尯 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 宸︿笅瑙掔洃瑙嗗櫒 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-group:first-child {
            gap: 8px;
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 2px;
            flex: 0 0 auto;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }



        /* 璁剧疆寮圭獥 */
        #settings-modal-panel {
            width:min(500px,100%);
            max-height:min(600px,calc(100vh-48px));
        }

        .settings-modal-body {
            display:flex;
            flex:1;
            min-height:0;
            overflow:hidden;
        }

        .settings-sidebar {
            width:160px;
            flex-shrink:0;
            display:flex;
            flex-direction:column;
            gap:2px;
            padding:14px 10px;
            border-right:1px solid var(--border);
            background:var(--nav-hover-bg);
        }

        .settings-sidebar-item {
            display:flex;
            align-items:center;
            gap:9px;
            padding:8px 12px;
            border-radius:8px;
            border:none;
            background:transparent;
            color:var(--muted);
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            transition:background .15s,color .15s;
            text-align:left;
        }

        .settings-sidebar-item:hover {
            background:var(--border);
            color:var(--text);
        }

        .settings-sidebar-item.active {
            background:var(--accent);
            color:#fff;
        }

        html.theme-dark .settings-sidebar-item.active,
        body.theme-dark .settings-sidebar-item.active {
            background:#f1f5f9;
            color:#0f172a;
        }

        .settings-content {
            flex:1;
            min-height:0;
            overflow:hidden;
            display:flex;
            flex-direction:column;
        }

        .settings-content-pane {
            display:none;
            flex:1;
            min-height:0;
        }

        .settings-content-pane.active {
            display:flex;
            flex-direction:column;
        }

        /* 鍏充簬椤甸潰 */
        .about-section {
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:32px 24px;
            text-align:center;
        }

        .about-app-icon {
            width:64px;
            height:64px;
            border-radius:16px;
            border:2px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--muted);
            margin-bottom:4px;
        }

        .about-app-name {
            font-size:18px;
            font-weight:900;
            color:var(--text);
        }

        .about-version {
            font-size:13px;
            font-weight:700;
            color:var(--muted);
        }

        .about-desc {
            font-size:13px;
            color:var(--muted);
            margin-bottom:8px;
        }

        .about-actions {
            display:flex;
            align-items:center;
            gap:8px;
            margin-top:4px;
        }

        .studio-modal[hidden] {
            display:none !important;
        }

        .studio-modal {
            position:fixed;
            inset:0;
            z-index:500;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:rgba(15,23,42,.38);
            backdrop-filter:blur(10px);
        }

        .studio-modal-panel {
            width:min(560px, 100%);
            max-height:min(760px, calc(100vh - 48px));
            display:flex;
            flex-direction:column;
            overflow:hidden;
            border-radius:8px;
            border:1px solid rgba(15,23,42,.1);
            background:#fff;
            color:#111827;
            box-shadow:0 24px 70px rgba(15,23,42,.24);
        }

        .studio-modal-head {
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:16px;
            padding:20px 20px 14px;
            border-bottom:1px solid #eef2f7;
        }

        .studio-modal-kicker {
            font-size:11px;
            font-weight:900;
            letter-spacing:.08em;
            color:#16a34a;
            text-transform:uppercase;
            margin-bottom:6px;
        }

        .studio-modal-title {
            font-size:20px;
            line-height:1.25;
            font-weight:900;
            margin:0;
            letter-spacing:0;
        }

        .studio-modal-close {
            width:32px;
            height:32px;
            border-radius:8px;
            border:1px solid #e5e7eb;
            background:#fff;
            color:#64748b;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            flex:0 0 auto;
        }

        .studio-modal-close:hover {
            color:#111827;
            border-color:#cbd5e1;
            background:#f8fafc;
        }

        .studio-modal-body {
            padding:18px 20px;
            overflow:auto;
        }

        .studio-modal-copy {
            margin:0 0 14px;
            color:#475569;
            font-size:13px;
            line-height:1.7;
        }

        .update-modal-summary {
            display:flex;
            align-items:flex-start;
            gap:10px;
            margin-top:16px;
            padding:12px;
            border:1px solid #e5e7eb;
            border-radius:8px;
            background:#f8fafc;
            color:#334155;
            font-size:12px;
            line-height:1.55;
        }

        .update-modal-summary strong {
            display:block;
            color:#111827;
            margin-bottom:2px;
            font-size:12px;
        }

        .update-modal-dot {
            width:9px;
            height:9px;
            margin-top:4px;
            border-radius:99px;
            background:#94a3b8;
            flex:0 0 auto;
        }

        .update-modal-summary.ok .update-modal-dot { background:#22c55e; }
        .update-modal-summary.warn .update-modal-dot { background:#f59e0b; }
        .update-modal-summary.fail .update-modal-dot { background:#ef4444; }

        /* 鏇存柊寮圭獥锛氬弻鍗＄墖闇€瑕佹洿瀹界殑闈㈡澘锛岄伩鍏嶅乏鍙冲竷灞€琚鍓?*/
        #project-update-modal .studio-modal-panel { width:min(880px, 100%); max-height:min(840px, calc(100vh - 48px)); }
        .update-notes-box { margin:2px 0 14px; padding:12px; border:1px solid #e5e7eb; border-radius:8px; background:#fbfdff; }
        .update-notes-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
        .update-notes-head strong { font-size:12px; color:#111827; font-weight:950; }
        .update-notes-version { color:#64748b; font-size:11px; font-weight:800; white-space:nowrap; }
        .update-notes-list { margin:0; padding:0 0 0 16px; display:grid; gap:6px; color:#334155; font-size:12px; line-height:1.55; }
        .update-notes-empty { margin:0; color:#94a3b8; font-size:12px; line-height:1.55; }
        .update-source-list { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; align-items:stretch; }
        @media (max-width: 720px) { .update-source-list { grid-template-columns:1fr; } }
        .update-source-card { width:100%; min-width:0; border:1px solid #e5e7eb; border-radius:10px; background:#fff; color:#111827; text-align:left; padding:12px; display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease; }
        .update-source-card:hover { transform:translateY(-1px); border-color:#cbd5e1; box-shadow:0 12px 28px rgba(15,23,42,.08); }
        .update-source-card.active { border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.20); background:#f0fdf4; }
        .update-source-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .update-source-title { min-width:0; display:flex; flex-direction:column; gap:4px; }
        .update-source-title strong { color:#111827; font-size:13px; line-height:1.2; font-weight:950; }
        .update-source-title span { color:#64748b; font-size:11px; line-height:1.35; font-weight:700; }
        .update-source-head-right { flex:0 0 auto; display:flex; align-items:center; gap:8px; }
        .update-source-check { display:none; flex:0 0 auto; width:22px; height:22px; border-radius:999px; background:#16a34a; color:#fff; align-items:center; justify-content:center; }
        .update-source-check svg { width:14px; height:14px; }
        .update-source-card.active .update-source-check { display:flex; }
        .update-source-badge { flex:0 0 auto; min-width:56px; height:24px; border-radius:999px; background:#f1f5f9; color:#64748b; display:flex; align-items:center; justify-content:center; padding:0 9px; font-size:10px; font-weight:900; }
        .update-source-badge.ok { background:#16a34a; color:#fff; }
        .update-source-badge.bad { background:#dc2626; color:#fff; }
        .connectivity-list { display:grid; gap:8px; min-width:0; }

        .connectivity-row {
            display:grid;
            grid-template-columns:12px minmax(0, 1fr) auto;
            align-items:center;
            gap:10px;
            min-height:42px;
            padding:9px 10px;
            border:1px solid #eef2f7;
            border-radius:8px;
            background:#fff;
        }
        .connectivity-row > div { min-width:0; }

        .connectivity-indicator {
            width:9px;
            height:9px;
            border-radius:99px;
            background:#94a3b8;
        }

        .connectivity-row.ok .connectivity-indicator { background:#22c55e; }
        .connectivity-row.fail .connectivity-indicator { background:#ef4444; }
        .connectivity-row.pending .connectivity-indicator {
            background:#94a3b8;
            animation: studio-pulse 1s ease-in-out infinite;
        }

        .connectivity-name {
            font-size:12px;
            font-weight:900;
            color:#111827;
            line-height:1.25;
        }

        .connectivity-url {
            margin-top:3px;
            max-width:100%;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-size:10px;
            color:#94a3b8;
        }

        .connectivity-status {
            justify-self:end;
            font-size:11px;
            font-weight:900;
            color:#64748b;
            white-space:nowrap;
        }
        .connectivity-row.ok .connectivity-status { color:#16a34a; }
        .connectivity-row.fail .connectivity-status { color:#ef4444; }

        .connectivity-error {
            grid-column:2 / 4;
            margin-top:-4px;
            color:#ef4444;
            font-size:11px;
            line-height:1.45;
            word-break:break-word;
        }

        .studio-modal-actions {
            display:flex;
            justify-content:flex-end;

    <script>
        document.getElementById('settings-modal')?.addEventListener('click', function(event) {
            if(event.target === this) closeSettingsModal();
        });
        function openSettingsModal() {
            document.getElementById('settings-modal').hidden = false;
        }
        function closeSettingsModal() {
            document.getElementById('settings-modal').hidden = true;
        }
        function switchSettingsTab(section) {
            document.querySelectorAll('.settings-sidebar-item').forEach(function(el) {
                el.classList.toggle('active', el.dataset.section === section);
            });
            document.querySelectorAll('.settings-content-pane').forEach(function(el) {
                el.classList.toggle('active', el.id === 'settings-pane-' + section);
            });
        }
        function checkElectronUpdate() {
            const btn = document.getElementById('update-app-btn');
            const text = document.getElementById('update-app-text');
            if(!window.electronAPI) return;
            text.textContent = '妫€鏌ヤ腑鈥?;
            btn.disabled = true;
            window.electronAPI.checkForUpdate();
        }
        if(window.electronAPI?.isElectron) {
            document.getElementById('update-app-btn').style.display = '';
            window.electronAPI.onUpdateStatus(function(status) {
                const btn = document.getElementById('update-app-btn');
                const text = document.getElementById('update-app-text');
                if(status.type === 'checking') {
                    text.textContent = '妫€鏌ヤ腑鈥?;
                } else if(status.type === 'available') {
                    text.textContent = '涓嬭浇 v' + status.version;
                    btn.onclick = function() { window.electronAPI.downloadUpdate(); text.textContent = '涓嬭浇涓€?; btn.disabled = true; };
                    btn.disabled = false;
                } else if(status.type === 'downloading') {
                    text.textContent = '涓嬭浇涓?' + status.percent + '%';
                } else if(status.type === 'downloaded') {
                    text.textContent = '瀹夎鏇存柊 v' + status.version;
                    btn.onclick = function() { window.electronAPI.installUpdate(); };
                    btn.disabled = false;
                } else if(status.type === 'not-available') {
                    text.textContent = '宸叉槸鏈€鏂扮増鏈?;
                    btn.disabled = true;
                    setTimeout(function(){ text.textContent = '妫€鏌ユ洿鏂?; btn.disabled = false; btn.onclick = checkElectronUpdate; }, 3000);
                } else if(status.type === 'error') {
                    text.textContent = '妫€鏌ュけ璐?;
                    btn.disabled = false;
                    btn.onclick = checkElectronUpdate;
                    setTimeout(function(){ text.textContent = '妫€鏌ユ洿鏂?; }, 3000);
                }
            });
        }
    </script>

                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>

                    <span id="project-update-confirm-text">寮€濮嬫洿鏂?/span>
                </button>

    </div>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const DEFAULT_PAGE_ID = 'canvas';
        const PAGE_IDS = ['canvas','asset-manager','api-settings','comfyui-settings'];
        const PROJECT_URL = 'https://github.com/hero8152/Infinite-Canvas';
        let appInfo = { version:'', repo_url:PROJECT_URL, version_url:'https://raw.githubusercontent.com/hero8152/Infinite-Canvas/main/VERSION' };
        let updateConnectivityResult = null;
        let projectUpdateRunning = false;
        let projectUpdateAbort = null;  // 褰撳墠鏇存柊璇锋眰鐨?AbortController锛屼究浜庣敤鎴蜂腑閫斿彇娑?        let updateSource = localStorage.getItem('studio_update_source') || 'github';
        let projectUpdateNotes = null;

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function switchUI(el, id, options = {}) {
            resetStudioRootScroll();
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.topbar-nav').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            if(target) {
                target.classList.add('active');
                if (!target.src) target.src = target.dataset.src;
                syncThemeToFrame(target);
                syncLanguageToFrame(target);
            }
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // 鍒囨崲鍒扮敾甯冩椂閫氱煡鍒锋柊宸ヤ綔娴佸垪琛紙闃叉鍦?comfyui-settings 淇敼鍚庣敾甯冩湭鍙婃椂鏇存柊锛?            if (id === 'canvas' && target && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
            }
            resetStudioRootScroll();
        }

        function forwardStudioApiChange(data) {
            if(!data || !['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                } catch(e) {}
            });
        }

        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            forwardStudioApiChange(event.data);
        });

        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.onmessage = event => forwardStudioApiChange(event.data);
        } catch(e) {}

        function restoreActivePage() {
            let id = localStorage.getItem(ACTIVE_PAGE_KEY);
            if(!id || !PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            const trigger = document.querySelector(`.topbar-nav[data-page="${id}"]`);
            switchUI(trigger, id, { skipRemember:true });
            document.documentElement.classList.remove('studio-route-booting');
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor?.classList.add('is-busy');
                    if (queueVal) queueVal.innerText = `${pos}/${total}`;
                    if (logoDot) logoDot.style.backgroundColor = '#3b82f6';
                } else {
                    monitor?.classList.remove('is-busy');
                    if (queueVal) queueVal.innerText = total > 0 ? total : '0';
                    if (logoDot) logoDot.style.backgroundColor = 'var(--text)';
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    // online-val removed
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'asset_library_updated') {
                    document.querySelectorAll('iframe').forEach(iframe => {
                        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                    });
                }
            };
            setInterval(syncStatus, 2000);
        }

        // --- 澶滈棿妯″紡 ---

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'light'}).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                }
            } catch (e) {}
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) {
                window.StudioTheme.set(theme);
            }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            const dark = theme === 'dark';
            if (dark) {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
            // lang label updated in DOMContentLoaded handler
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        function toggleLanguage() {
            if(!window.StudioI18n) return;
            window.StudioI18n.toggle();
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
            const label = document.querySelector('#lang-label');
            if(label) label.textContent = window.StudioI18n?.lang?.() === 'en' ? 'EN' : '涓?;
            updateProjectUpdateTitle();
            refreshUpdateButtonText();
            refreshProjectUpdateModalText();
        }

        function syncLanguageToFrame(frame) {
            if(!window.StudioI18n) return;
            try {
                frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
            } catch(e) {}
        }

        function broadcastLanguage() {
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
                } catch(e) {}
            });
        }

        // listen for theme changes triggered by theme.js
        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        // init icon state on load
        window.addEventListener('DOMContentLoaded', () => {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeIcon(theme);
            if(window.StudioI18n) {
                window.StudioI18n.apply();
                const label = document.querySelector('#lang-label');
                if(label) label.textContent = window.StudioI18n.lang() === 'en' ? 'EN' : '涓?;
            }
            broadcastLanguage();
            checkForUpdates();
        });

        // sync theme when iframe loads
        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => {
                syncThemeToFrame(f);
                syncLanguageToFrame(f);
            });
        });

        function openProjectPage() {
            window.open(appInfo.repo_url || PROJECT_URL, '_blank', 'noopener');
        }

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function compactVersion(value) {
            const text = String(value || '').trim();
            const parts = text.match(/\d+/g) || [];
            if(parts.length >= 3) return `${parts[1]}.${parts[2]}`;
            return text.replace(/^v/i, '') || '-';
        }

        function versionLabel(value, mode = 'full') {
            const text = String(value || '').trim();
            if(!text) return 'v-';
            return mode === 'compact' ? `v${compactVersion(text)}` : `v${text.replace(/^v/i, '')}`;
        }

        function setProjectVersionBadge(version) {
            const label = document.getElementById('settings-version-label');
            if(!label) return;
            label.textContent = version ? versionLabel(version) : 'v-';
        }

        function refreshUpdateButtonText() {
            const btn = document.getElementById('update-now-settings-btn');
            const text = document.getElementById('update-now-settings-text');
            if(!btn || !text || !btn.classList.contains('show')) return;
            const remoteVersion = appInfo.latestVersion || '';
            const isEn = window.StudioI18n?.lang?.() === 'en';
            text.removeAttribute('data-i18n');
            if(remoteVersion) {
                const prefix = isEn ? 'Update to' : '鏇存柊鍒?;
                text.replaceChildren();
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'update-action-prefix';
                prefixSpan.textContent = `${prefix} `;
                const compactSpan = document.createElement('span');
                compactSpan.className = 'update-version-compact';
                compactSpan.textContent = versionLabel(remoteVersion, 'compact');
                const fullSpan = document.createElement('span');
                fullSpan.className = 'update-version-full';
                fullSpan.textContent = versionLabel(remoteVersion);
                text.append(prefixSpan, compactSpan, fullSpan);
                btn.setAttribute('aria-label', `${prefix} ${versionLabel(remoteVersion)}`);
            } else {
                text.textContent = isEn ? 'Update' : '涓€閿洿鏂?;
                btn.setAttribute('aria-label', text.textContent);
            }
        }

        function updateProjectUpdateTitle() {
            setProjectVersionBadge(appInfo.version || '');
            if(!appInfo.latestVersion) return;
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const remoteVersion = appInfo.latestVersion;
            const updateBtn = document.getElementById('update-now-settings-btn');
            if(updateBtn) updateBtn.title = remoteVersion
                ? (isEn ? `Update to ${versionLabel(remoteVersion)}` : `鏇存柊鍒?${versionLabel(remoteVersion)}`)
                : (isEn ? 'Update main.py and static files from GitHub' : '浠?GitHub 鏇存柊 main.py 鍜?static 鏂囦欢');
            refreshUpdateButtonText();
        }

        function showUpdateNotice(localVersion, remoteVersion) {
            appInfo.latestVersion = remoteVersion || '';
            const gearBtn = document.getElementById('settings-gear-btn');
            if(gearBtn) gearBtn.classList.add('has-update');
            const updateBtn = document.getElementById('update-now-settings-btn');
            if(updateBtn) updateBtn.classList.add('show');
            updateProjectUpdateTitle();
        }

        function setProjectUpdateNotes(notes) {
            projectUpdateNotes = notes && typeof notes === 'object' ? notes : null;
            renderProjectUpdateNotes();
        }

        function renderProjectUpdateNotes() {
            const box = document.getElementById('project-update-notes');
            if(!box) return;
            const titleEl = document.getElementById('project-update-notes-title');
            const versionEl = document.getElementById('project-update-notes-version');
            const list = document.getElementById('project-update-notes-list');
            const empty = document.getElementById('project-update-notes-empty');
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const notes = projectUpdateNotes || {};
            const items = Array.isArray(notes.items) ? notes.items.filter(Boolean) : [];
            if(titleEl) titleEl.textContent = isEn ? 'What changed' : '鏈鏇存柊鍐呭';
            if(versionEl) versionEl.textContent = notes.version ? versionLabel(notes.version) : '';
            if(list) {
                list.replaceChildren();
                items.slice(0, 8).forEach(item => {
                    const text = typeof item === 'string' ? item : item.text;
                    if(!text) return;
                    const li = document.createElement('li');
                    li.textContent = String(text);
                    list.append(li);
                });
            }
            const hasItems = !!(list && list.children.length);
            if(empty) {
                empty.hidden = hasItems;
                empty.textContent = isEn ? 'No update notes were found for this version.' : '鏆傛湭鑾峰彇鍒拌繖涓増鏈殑鏇存柊璇存槑銆?;
            }
            box.hidden = !(notes.version || hasItems);
        }

        function describeNetworkError(err, isEn){
            const msg = String(err?.message || err || '');
            const isNetwork = (err instanceof TypeError) || /Failed to fetch|NetworkError|ERR_|timed? ?out|瓒呮椂|鏃犳硶杩炴帴|GitHub|HTTP 4|HTTP 5/i.test(msg);
            if(isNetwork){
                return isEn
                    ? 'Cannot reach the selected update source. Check your network, proxy, or DNS, then try again.'
                    : '鏃犳硶杩炴帴褰撳墠閫夋嫨鐨勬洿鏂版簮銆傝妫€鏌ョ綉缁溿€佷唬鐞嗘垨 DNS 鍚庨噸璇曘€?;
            }
            return msg || (isEn ? 'Update failed' : '鏇存柊澶辫触');
        }

        function updateUiText(zh, en) {
            return window.StudioI18n?.lang?.() === 'en' ? en : zh;
        }

        function updateSourceLabel(source = updateSource) {
            return source === 'modelscope' ? 'ModelScope' : 'GitHub';
        }

        function setUpdateSource(source) {
            updateSource = source === 'modelscope' ? 'modelscope' : 'github';
            localStorage.setItem('studio_update_source', updateSource);
            refreshProjectUpdateModalText();
        }

        function sourceConnectivityStats(source, results = []) {
            const sourceItems = (results || []).filter(item => item.source === source);
            const required = sourceItems.filter(item => item.required);
            const okRequired = required.length ? required.every(item => item.ok) : false;
            const okItems = sourceItems.filter(item => item.ok);
            const avg = okItems.length
                ? Math.round(okItems.reduce((sum, item) => sum + Number(item.elapsed_ms || 0), 0) / okItems.length)
                : 999999;
            return {source, ok:okRequired, avg, okItems:okItems.length, total:sourceItems.length};
        }

        function bestUpdateSourceFromConnectivity(data) {
            const results = data?.results || [];
            const github = sourceConnectivityStats('github', results);
            const ms = sourceConnectivityStats('modelscope', results);
            if(github.ok && ms.ok) return ms.avg < github.avg ? 'modelscope' : 'github';
            if(ms.ok) return 'modelscope';
            if(github.ok) return 'github';
            return updateSource;
        }

        function updateTargetLabel(name) {
            const labels = {
                'GitHub 鏇存柊鍒楄〃': ['GitHub 鏇存柊鍒楄〃', 'GitHub update API'],
                'GitHub 鐗堟湰鏂囦欢': ['GitHub 鐗堟湰鏂囦欢', 'GitHub version file'],
                'GitHub 涓婚〉': ['GitHub 涓婚〉', 'GitHub home page'],
                'ModelScope 鏇存柊鍒楄〃': ['ModelScope 鏇存柊鍒楄〃', 'ModelScope update list'],
                'ModelScope 鐗堟湰鏂囦欢': ['ModelScope 鐗堟湰鏂囦欢', 'ModelScope version file'],
                'ModelScope 绌洪棿椤甸潰': ['ModelScope 绌洪棿椤甸潰', 'ModelScope space page'],
                'ModelScope 涓婚〉': ['ModelScope 涓婚〉', 'ModelScope home page'],
                'Google 杩為€氭€?: ['Google 杩為€氭€?, 'Google connectivity'],
            };
            const item = labels[name] || [name, name];
            return window.StudioI18n?.lang?.() === 'en' ? item[1] : item[0];
        }

        function updateStatusLabel(item) {
            if(item.pending) return updateUiText('妫€娴嬩腑...', 'Testing...');
            if(item.ok) return `${updateUiText('姝ｅ父', 'OK')} 路 ${item.elapsed_ms || 0}ms`;
            if(item.timed_out) return updateUiText('澶辫触 路 瓒呮椂', 'Failed 路 timeout');
            if(item.status) return `HTTP ${item.status}`;
            return updateUiText('澶辫触', 'Failed');
        }

        function setUpdateSummary(kind, title, text) {
            const box = document.getElementById('project-update-summary');
            const titleEl = document.getElementById('project-update-summary-title');
            const textEl = document.getElementById('project-update-summary-text');
            if(box) {
                box.classList.remove('ok', 'warn', 'fail');
                box.classList.add(kind || 'warn');
            }
            if(titleEl) titleEl.textContent = title;
            if(textEl) textEl.textContent = text;
        }

        function updateConnectivityTargets() {
            const sources = appInfo.sources || {};
            const github = sources.github || {};
            const ms = sources.modelscope || {};
            return [
                { name:'GitHub 鏇存柊鍒楄〃', url:github.tree_url || appInfo.tree_url || 'https://api.github.com/repos/hero8152/Infinite-Canvas/git/trees/main?recursive=1', source:'github', required:true },
                { name:'GitHub 鐗堟湰鏂囦欢', url:github.version_url || appInfo.version_url || 'https://raw.githubusercontent.com/hero8152/Infinite-Canvas/main/VERSION', source:'github', required:true },
                { name:'GitHub 涓婚〉', url:'https://github.com/', source:'github' },
                { name:'ModelScope 鐗堟湰鏂囦欢', url:ms.version_url || 'https://www.modelscope.cn/api/v1/studio/Daniel8152/Infinite-Canvas/repo?Revision=master&FilePath=VERSION', source:'modelscope', required:true },
                { name:'ModelScope 绌洪棿椤甸潰', url:ms.repo_url || 'https://modelscope.cn/studios/Daniel8152/Infinite-Canvas', source:'modelscope' },
                { name:'ModelScope 涓婚〉', url:'https://modelscope.cn/', source:'modelscope' },
                { name:'Google 杩為€氭€?, url:'https://www.google.com/generate_204', source:'reference' },
            ];
        }

        function renderConnectivityList(results = []) {
            const allItems = results.length ? results : updateConnectivityTargets().map(item => ({...item, pending:false, untouched:true}));
            const renderInto = (list, source) => {
                if(!list) return;
                list.replaceChildren();
                const items = allItems.filter(item => item.source === source || (source === 'github' && item.source === 'reference'));
                items.forEach(item => {
                const row = document.createElement('div');
                row.className = `connectivity-row ${item.pending ? 'pending' : item.untouched ? '' : item.ok ? 'ok' : 'fail'}`;
                const indicator = document.createElement('span');
                indicator.className = 'connectivity-indicator';
                const meta = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'connectivity-name';
                name.textContent = updateTargetLabel(item.name);
                const url = document.createElement('div');
                url.className = 'connectivity-url';
                url.textContent = item.url || '';
                meta.append(name, url);
                const status = document.createElement('div');
                status.className = 'connectivity-status';
                status.textContent = item.untouched ? updateUiText('寰呮祴璇?, 'Not tested') : updateStatusLabel(item);
                row.append(indicator, meta, status);
                if(item.error && !item.timed_out) {
                    const error = document.createElement('div');
                    error.className = 'connectivity-error';
                    error.textContent = String(item.error).slice(0, 220);
                    row.append(error);
                }
                list.append(row);
            });
            };
            renderInto(document.querySelector('[data-connectivity-source="github"]'), 'github');
            renderInto(document.querySelector('[data-connectivity-source="modelscope"]'), 'modelscope');
        }

        function refreshProjectUpdateModalText() {
            const remoteVersion = appInfo.latestVersion || '';
            const localVersion = appInfo.version || '';
            const sourceName = updateSourceLabel();
            const title = remoteVersion
                ? updateUiText(`鏇存柊鍒?${versionLabel(remoteVersion)}`, `Update to ${versionLabel(remoteVersion)}`)
                : updateUiText('涓€閿洿鏂?, 'One-click update');
            const titleEl = document.getElementById('project-update-title');
            const copyEl = document.getElementById('project-update-copy');
            const testText = document.getElementById('connectivity-test-text');
            const cancelText = document.getElementById('project-update-cancel-text');
            const confirmText = document.getElementById('project-update-confirm-text');
            const closeBtn = document.querySelector('#project-update-modal .studio-modal-close');
            if(titleEl) titleEl.textContent = title;
            renderProjectUpdateNotes();
            document.querySelectorAll('[data-update-source]').forEach(card => {
                const source = card.dataset.updateSource || 'github';
                const active = source === updateSource;
                card.classList.toggle('active', active);
                card.setAttribute('aria-pressed', active ? 'true' : 'false');
                const badge = card.querySelector('.update-source-badge');
                if(badge) {
                    if(!updateConnectivityResult) {
                        setSourceBadge(badge, '', updateUiText('寰呮祴璇?, 'Not tested'));
                    } else {
                        const stats = sourceConnectivityStats(source, updateConnectivityResult.results || []);
                        setSourceBadge(badge, stats.ok ? 'ok' : 'bad',
                            stats.ok ? updateUiText('鍙敤', 'Available') : updateUiText('涓嶅彲鐢?, 'Unavailable'));
                    }
                }
            });
            if(copyEl) copyEl.textContent = updateUiText(
                `灏嗕粠 ${sourceName} 鏇存柊 main.py銆乂ERSION 鍜?static 鏂囦欢銆傛洿鏂板墠浼氳嚜鍔ㄥ浠斤紝鏇存柊瀹屾垚鍚庡悗绔細鑷姩閲嶅惎銆傚綋鍓?${versionLabel(localVersion)}锛屾渶鏂?${versionLabel(remoteVersion || localVersion)}銆俙,
                `This updates main.py, VERSION, and static files from ${sourceName}. A backup is created first, then the backend restarts automatically. Current ${versionLabel(localVersion)}, latest ${versionLabel(remoteVersion || localVersion)}.`
            );
            if(testText) testText.textContent = updateConnectivityResult ? updateUiText('閲嶆柊娴嬭瘯', 'Retest') : updateUiText('娴嬭瘯杩為€氭€?, 'Test connectivity');
            if(cancelText) cancelText.textContent = updateUiText('鍙栨秷', 'Cancel');
            if(confirmText && !projectUpdateRunning) confirmText.textContent = updateUiText('寮€濮嬫洿鏂?, 'Start update');
            if(closeBtn) {
                closeBtn.title = updateUiText('鍏抽棴', 'Close');
                closeBtn.setAttribute('aria-label', closeBtn.title);
            }
            if(!updateConnectivityResult) {
                setUpdateSummary(
                    'warn',
                    updateUiText('寤鸿鍏堟祴璇曡繛閫氭€?, 'Connectivity test recommended'),
                    updateUiText(
                        '娴嬭瘯浼氬悓鏃舵祴閫?GitHub 鍜?ModelScope銆備綘鍙互鏍规嵁缁撴灉鍒囨崲涓嬭浇婧愩€?,
                        'The test checks both GitHub and ModelScope. Choose the faster reachable source before updating.'
                    )
                );
            } else if(updateConnectivityResult.backend_missing) {
                setUpdateSummary(
                    'fail',
                    updateUiText('闇€瑕侀噸鍚悗绔?, 'Backend restart required'),
                    updateUiText(
                        '褰撳墠椤甸潰宸茬粡鏇存柊锛屼絾鍚庣浠嶆槸鏃х増鏈紝鎵€浠ユ壘涓嶅埌杩為€氭€ф祴璇曟帴鍙ｃ€傝閲嶅惎鏈嶅姟鍚庡啀璇曘€?,
                        'The page is updated, but the backend is still the old version and cannot find the connectivity-test API. Restart the service and try again.'
                    )
                );
            } else if((updateConnectivityResult.sources || {})[updateSource]?.ok || (updateSource === 'github' && updateConnectivityResult.ok)) {
                const google = (updateConnectivityResult.results || []).find(item => item.name === 'Google 杩為€氭€?);
                const sourceResults = (updateConnectivityResult.results || []).filter(item => item.source === updateSource);
                const fastest = sourceResults.filter(item => item.ok).sort((a, b) => (a.elapsed_ms || 999999) - (b.elapsed_ms || 999999))[0];
                setUpdateSummary(
                    google?.ok ? 'ok' : 'warn',
                    updateUiText(`${sourceName} 涓嬭浇婧愬彲鐢╜, `${sourceName} source reachable`),
                    fastest
                        ? updateUiText(`${sourceName} 鍙闂紝鏈€蹇妭鐐圭害 ${fastest.elapsed_ms || 0}ms锛屽彲浠ュ紑濮嬫洿鏂般€俙, `${sourceName} is reachable; fastest endpoint is about ${fastest.elapsed_ms || 0}ms.`)
                        : updateUiText(`${sourceName} 鏇存柊鑺傜偣鍙敤锛屽彲浠ュ紑濮嬫洿鏂般€俙, `${sourceName} update endpoints are reachable.`)
                );
            } else {
                setUpdateSummary(
                    'fail',
                    updateUiText(`${sourceName} 涓嬭浇婧愪笉鍙敤`, `${sourceName} source unreachable`),
                    updateUiText(
                        `褰撳墠缃戠粶鏃犳硶璁块棶 ${sourceName} 蹇呴渶鑺傜偣銆傝鍒囨崲涓嬭浇婧愶紝鎴栨鏌ヤ唬鐞嗐€丏NS 鍚庨噸璇曘€俙,
                        `This network cannot reach required ${sourceName} endpoints. Switch source, or check proxy/DNS and try again.`
                    )
                );
            }
            renderConnectivityList(updateConnectivityResult?.results || []);
        }

        function openProjectUpdateModal() {
            const modal = document.getElementById('project-update-modal');
            if(!modal) return;
            updateConnectivityResult = null;
            refreshProjectUpdateModalText();
            modal.hidden = false;
            document.getElementById('connectivity-test-btn')?.focus?.();
        }

        function closeProjectUpdateModal() {
            // 鏇存柊杩涜涓厑璁稿叧闂細涓鍦ㄩ€旇姹傚苟鎭㈠ UI锛岄伩鍏嶃€屽崱鍦ㄦ洿鏂颁腑銆佹棤娉曞叧闂€?            if(projectUpdateRunning) {
                try { projectUpdateAbort?.abort(); } catch(e) {}
            }
            const modal = document.getElementById('project-update-modal');
            if(modal) modal.hidden = true;
        }

        document.getElementById('project-update-modal')?.addEventListener('click', event => {
            if(event.target?.id === 'project-update-modal') closeProjectUpdateModal();
        });

        window.addEventListener('keydown', event => {
            if(event.key === 'Escape') {
                closeProjectUpdateModal();
                closeSettingsModal();
            }
        });

        async function runProjectUpdate() {
            openProjectUpdateModal();
        }

        function computeConnectivitySources(results) {
            const out = {};
            for(const source of ['github', 'modelscope']) {
                const reqAll = (results || []).filter(it => it.source === source && it.required);
                out[source] = {
                    ok: reqAll.length > 0 && reqAll.every(it => it.ok),
                    required: reqAll.map(it => it.name),
                };
            }
            return out;
        }

        function setSourceBadge(badge, state, text) {
            if(!badge) return;
            badge.classList.remove('ok', 'bad');
            if(state) badge.classList.add(state);
            badge.textContent = text;
        }

        function renderSourceBadgesLive(results) {
            document.querySelectorAll('[data-update-source]').forEach(card => {
                const source = card.dataset.updateSource || 'github';
                const badge = card.querySelector('.update-source-badge');
                if(!badge) return;
                const items = (results || []).filter(it => it.source === source);
                if(!items.length) return;
                const done = items.filter(it => !it.pending && !it.untouched);
                if(done.length < items.length) {
                    setSourceBadge(badge, '', updateUiText(`妫€娴嬩腑 ${done.length}/${items.length}`, `${done.length}/${items.length}`));
                    return;
                }
                const stats = sourceConnectivityStats(source, results);
                setSourceBadge(badge, stats.ok ? 'ok' : 'bad',
                    stats.ok ? updateUiText('鍙敤', 'Available') : updateUiText('涓嶅彲鐢?, 'Unavailable'));
            });
        }

        let connectivityTesting = false;
        async function runUpdateConnectivityTest() {
            if(connectivityTesting) return; // 闃叉閲嶅鐐瑰嚮瀵艰嚧鐘舵€侀敊涔?            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('connectivity-test-btn');
            const text = document.getElementById('connectivity-test-text');
            connectivityTesting = true;
            if(btn) btn.disabled = true;
            if(text) text.textContent = isEn ? 'Testing...' : '妫€娴嬩腑...';
            updateConnectivityResult = null;

            const targets = updateConnectivityTargets();
            // 瀹炴椂鐘舵€佹暟缁勶細鍏堝叏閮ㄧ疆涓恒€屾娴嬩腑銆嶏紝姣忔潯鎺㈡祴瀹屾垚绔嬪嵆鍒锋柊瀵瑰簲琛?            const live = targets.map(item => ({...item, pending:true, untouched:false}));
            let backendMissing = false;
            const applyResult = (name, patch) => {
                const i = live.findIndex(x => x.name === name);
                if(i < 0) return;
                live[i] = {...live[i], pending:false, untouched:false, ...patch};
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
            };

            const probeOne = async (t) => {
                // 瀹㈡埛绔厹搴曡秴鏃讹細5s 鎺㈡祴 + 1s 缃戠粶浣欓噺锛岃秴鏃跺嵆鎶ャ€岃秴鏃躲€嶏紝涓嶄細姘歌繙鍗″湪銆屾娴嬩腑銆?                const ac = new AbortController();
                const killer = setTimeout(() => ac.abort(), 6000);
                try {
                    const res = await fetch(`/api/update-connectivity/probe?name=${encodeURIComponent(t.name)}`, { cache:'no-store', signal:ac.signal });
                    const data = await res.json().catch(() => ({}));
                    // 鏃у悗绔病鏈夊崟鏉℃帰娴嬫帴鍙?鈫?404 Not Found锛屾爣璁板悗鍥為€€鍒版暣浣撴帴鍙?                    if(res.status === 404 && (data.detail === 'Not Found' || data.detail === undefined)) {
                        backendMissing = true;
                        return;
                    }
                    if(res.ok) {
                        applyResult(t.name, { ok:!!data.ok, status:data.status || 0, elapsed_ms:data.elapsed_ms || 0, error:data.error || '', timed_out:!!data.timed_out });
                    } else {
                        applyResult(t.name, { ok:false, error:data.detail || (isEn ? 'Failed' : '澶辫触') });
                    }
                } catch(e) {
                    if(e && e.name === 'AbortError') {
                        applyResult(t.name, { ok:false, timed_out:true, error:isEn ? 'Timed out (over 5s)' : '杩炴帴瓒呮椂锛堣秴杩?5s锛? });
                    } else {
                        applyResult(t.name, { ok:false, error:describeNetworkError(e, isEn) });
                    }
                } finally {
                    clearTimeout(killer);
                }
            };

            try {
                setUpdateSummary('warn', isEn ? 'Testing connectivity' : '姝ｅ湪娴嬭瘯杩為€氭€?, isEn ? 'Probing each endpoint 鈥?results stream in live.' : '姝ｅ湪閫愭潯妫€娴嬪悇鑺傜偣锛岀粨鏋滃疄鏃舵樉绀恒€?);
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
                await Promise.all(targets.map(probeOne));

                if(backendMissing) {
                    // 鍏滃簳锛氬皾璇曟棫鐨勬暣浣撴帴鍙?                    try {
                        const res = await fetch('/api/update-connectivity', { cache:'no-store' });
                        const data = await res.json().catch(() => ({}));
                        if(res.ok && Array.isArray(data.results)) {
                            updateConnectivityResult = data;
                            setUpdateSource(bestUpdateSourceFromConnectivity(data));
                            return;
                        }
                    } catch(e) {}
                    const message = isEn
                        ? 'The backend has not loaded the new connectivity-test API yet. Restart the backend service, then test again.'
                        : '鍚庣杩樻病鏈夊姞杞芥柊鐨勮繛閫氭€ф祴璇曟帴鍙ｃ€傝閲嶅惎鏈嶅姟鍚庡啀娴嬭瘯銆?;
                    updateConnectivityResult = {
                        ok:false,
                        backend_missing:true,
                        results:targets.map(item => ({...item, ok:false, elapsed_ms:0, error:message })),
                    };
                    return;
                }

                const results = live.map(({pending, untouched, ...rest}) => rest);
                const sources = computeConnectivitySources(results);
                updateConnectivityResult = { results, sources, ok:sources.github.ok };
                setUpdateSource(bestUpdateSourceFromConnectivity(updateConnectivityResult));
            } finally {
                connectivityTesting = false;
                if(btn) btn.disabled = false;
                refreshProjectUpdateModalText();
            }
        }

        async function confirmProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('update-now-settings-btn');
            const text = document.getElementById('update-now-settings-text');
            const confirmBtn = document.getElementById('project-update-confirm-btn');
            const confirmText = document.getElementById('project-update-confirm-text');
            const testBtn = document.getElementById('connectivity-test-btn');
            const oldText = text?.textContent || '';
            projectUpdateRunning = true;
            if(btn) btn.disabled = true;
            if(confirmBtn) confirmBtn.disabled = true;
            if(testBtn) testBtn.disabled = true;
            if(text) text.textContent = isEn ? 'Updating...' : '鏇存柊涓?..';
            if(confirmText) confirmText.textContent = isEn ? 'Updating...' : '鏇存柊涓?..';
            const sourceName = updateSourceLabel();
            setUpdateSummary('warn', isEn ? 'Updating' : '姝ｅ湪鏇存柊', isEn ? `Downloading files from ${sourceName} and creating a local backup.` : `姝ｅ湪浠?${sourceName} 涓嬭浇鏂囦欢锛屽苟鍒涘缓鏈湴澶囦唤銆俙);
            // 瀹㈡埛绔厹搴曡秴鏃讹細鍗充娇鍚庣寮傚父鎸傝捣锛孶I 涔熻兘鎭㈠锛屼笉浼氭案杩滃仠鍦ㄣ€屾洿鏂颁腑銆?            const ac = new AbortController();
            const killer = setTimeout(() => ac.abort(), 300000);
            try {
                const res = await fetch('/api/update-from-github', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ auto_restart:true, restart_delay:3, source:updateSource, fallback:true, version: appInfo.latestVersion }),
                    signal:ac.signal
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Update failed' : '鏇存柊澶辫触'));
                if(data.update_notes) setProjectUpdateNotes(data.update_notes);
                const restarting = data.restart_scheduled;
                const usedLabel = data.source_label || (data.source === 'modelscope' ? 'ModelScope' : 'GitHub');
                const fallbackNote = data.fallback_used
                    ? (isEn
                        ? ` (${sourceName} was unreachable, so it fell back to ${usedLabel})`
                        : `锛?{sourceName} 涓嶅彲鐢紝宸茶嚜鍔ㄥ厹搴曞垏鎹㈠埌 ${usedLabel}锛塦)
                    : '';
                setUpdateSummary(
                    'ok',
                    isEn ? 'Update complete' : '鏇存柊瀹屾垚',
                    (restarting
                        ? (isEn
                            ? `Updated ${data.count || 0} files. The backend will restart in about 3 seconds; this page will reload when it returns.`
                            : `宸叉洿鏂?${data.count || 0} 涓枃浠躲€傚悗绔皢鍦ㄧ害 3 绉掑悗鑷姩閲嶅惎锛屾湰椤甸潰浼氬湪鎭㈠鍚庤嚜鍔ㄥ埛鏂般€俙)
                        : (isEn
                            ? `Updated ${data.count || 0} files. Please restart the backend, then refresh this page.`
                            : `宸叉洿鏂?${data.count || 0} 涓枃浠躲€傝閲嶅惎鍚庣锛岀劧鍚庡埛鏂伴〉闈€俙)) + fallbackNote
                );
                document.getElementById('settings-gear-btn')?.classList.remove('has-update');
                btn?.classList.remove('show');
                setProjectVersionBadge(data.version || appInfo.latestVersion || appInfo.version);
                if(restarting) waitForBackendAndReload();
            } catch(e) {
                const msg = (e && e.name === 'AbortError')
                    ? (isEn ? 'Update timed out. Switch source or check your network, then retry.' : '鏇存柊瓒呮椂銆傝鍒囨崲涓嬭浇婧愭垨妫€鏌ョ綉缁滃悗閲嶈瘯銆?)
                    : describeNetworkError(e, isEn);
                setUpdateSummary('fail', isEn ? 'Update failed' : '鏇存柊澶辫触', msg);
            } finally {
                clearTimeout(killer);
                projectUpdateRunning = false;
                if(btn) btn.disabled = false;
                if(confirmBtn) confirmBtn.disabled = false;
                if(testBtn) testBtn.disabled = false;
                if(text) text.textContent = oldText || (isEn ? 'Update' : '涓€閿洿鏂?);
                if(confirmText) confirmText.textContent = isEn ? 'Start update' : '寮€濮嬫洿鏂?;
                refreshUpdateButtonText();
            }
        }
        async function waitForBackendAndReload() {
            const deadline = Date.now() + 90 * 1000;
            await new Promise(r => setTimeout(r, 4000));
            while(Date.now() < deadline) {
                try {
                    const r = await fetch('/api/app-info', { cache:'no-store' });
                    if(r.ok) { location.reload(); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        async function rollbackProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            try {
                const list = await fetch('/api/update-backups').then(r => r.json());
                const backups = list.backups || [];
                if(!backups.length){ alert(isEn ? 'No backups available.' : '娌℃湁鍙敤鐨勫浠?); return; }
                const lines = backups.slice(0, 8).map((b, i) => {
                    const d = new Date((b.created_at || 0) * 1000);
                    const ts = d.toLocaleString();
                    return `${i + 1}. ${b.name}  (${b.file_count} files, ${ts})`;
                });
                const promptMsg = (isEn
                    ? 'Select a backup to restore (enter the number):\n'
                    : '閫夋嫨瑕佽繕鍘熺殑澶囦唤锛堣緭鍏ュ簭鍙凤級锛歕n') + lines.join('\n');
                const answer = prompt(promptMsg, '1');
                const idx = Number(answer) - 1;
                if(!(idx >= 0 && idx < backups.length)) return;
                const target = backups[idx];
                if(!confirm(isEn ? `Restore "${target.name}"? Backend will restart.` : `瑕佽繕鍘?"${target.name}" 鍚楋紵鍚庣浼氳嚜鍔ㄩ噸鍚€俙)) return;
                const res = await fetch('/api/update-rollback', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:target.name, auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Rollback failed' : '鍥炴粴澶辫触'));
                alert(isEn
                    ? `Restored ${data.count || 0} files. Backend is restarting.`
                    : `宸茶繕鍘?${data.count || 0} 涓枃浠躲€傚悗绔鍦ㄩ噸鍚€俙);
                if(data.restart_scheduled) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Rollback failed: ' : '鍥炴粴澶辫触锛?) + describeNetworkError(e, isEn));
            }
        }
        window.rollbackProjectUpdate = rollbackProjectUpdate;

        async function checkForUpdates(manual = false) {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const badge = document.getElementById('settings-version-label');
            if(manual && badge) badge.classList.add('checking');
            try {
                const info = await fetch('/api/app-info', { cache:'no-store' }).then(r => r.json()).catch(() => ({}));
                appInfo = {...appInfo, ...info};
                let current = String(appInfo.version || '').trim();
                setProjectVersionBadge(current);
                let best = null;
                let reachable = false;
                let serverChecked = false;
                // 浼樺厛璧板悗绔娴嬶細鏈嶅姟绔敤绯荤粺浠ｇ悊鍚屾椂妫€娴?GitHub 鍜?ModelScope锛岄伩鍏嶆祻瑙堝櫒璺ㄥ煙/琚
                try {
                    const r = await fetch('/api/check-update', { cache:'no-store' });
                    if(r.ok) {
                        const d = await r.json();
                        serverChecked = true;
                        reachable = !!d.reachable;
                        if(d.current) { current = String(d.current).trim(); setProjectVersionBadge(current); }
                        if(d.latest?.version) best = {source:d.latest.source, version:d.latest.version, update_notes:d.latest.update_notes || d.update_notes || null};
                    }
                } catch(e) {}
                // 鍏滃簳锛氭棫鍚庣鏃?/api/check-update 鏃讹紝娴忚鍣ㄧ洿鎺ユ媺鍙栧弻婧?VERSION
                if(!serverChecked) {
                    const sources = appInfo.sources || {};
                    const candidates = [
                        {source:'github', url:sources.github?.version_url || appInfo.version_url || ''},
                        {source:'modelscope', url:sources.modelscope?.version_url || ''},
                    ].filter(item => item.url);
                    for(const item of candidates) {
                        try {
                            const remoteText = await fetch(`${item.url}${item.url.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache:'no-store' }).then(r => r.ok ? r.text() : '');
                            const remote = String(remoteText || '').trim().split(/\r?\n/)[0].trim();
                            if(remote){ reachable = true; if(!best || compareVersions(remote, best.version) > 0) best = {source:item.source, version:remote}; }
                        } catch(e) {}
                    }
                }
                const hasUpdate = !!(current && best?.version && compareVersions(best.version, current) > 0);
                if(hasUpdate) {
                    if(best.source === 'modelscope') setUpdateSource('modelscope');
                    setProjectUpdateNotes(best.update_notes || null);
                    showUpdateNotice(current, best.version);
                }
                if(manual) {
                    if(hasUpdate) {
                        openProjectUpdateModal();
                    } else if(reachable) {
                        alert(isEn ? `You are on the latest version (${versionLabel(current)}).` : `宸叉槸鏈€鏂扮増鏈紙${versionLabel(current)}锛夈€俙);
                    } else {
                        alert(isEn ? 'Could not reach GitHub or ModelScope. Check your network/proxy and try again.' : '鏃犳硶杩炴帴 GitHub 鎴?ModelScope 鏇存柊婧愶紝璇锋鏌ョ綉缁滄垨浠ｇ悊鍚庨噸璇曘€?);
                    }
                }
            } catch(e) {
                // 绂荤嚎鍖呴噷娌℃湁缃戠粶鏃朵繚鎸佸畨闈欙紝涓嶅奖鍝嶆湰鍦颁娇鐢ㄣ€?                if(manual) alert(isEn ? 'Update check failed.' : '妫€娴嬫洿鏂板け璐ャ€?);
            } finally {
                if(badge) badge.classList.remove('checking');
            }
        }
    </script>
