<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>椤圭洰宸ヤ綔鍙?/title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.08.06.6"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.06.6"></script>
    <script src="/static/js/theme.js?v=2026.08.06.6"></script>
    <script src="/static/js/i18n.js?v=2026.08.06.6"></script>
    <link rel="stylesheet" href="/static/css/canvas-list.css?v=2026.08.06.6">
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.06.6">
</head>
<body>
    <div id="workspace" class="workspace">
        <!-- LEFT: project sidebar -->
        <aside id="sidebar" class="ws-sidebar">
            <div class="ws-side-head">
                <div class="ws-side-title">椤圭洰</div>
                <button id="newProjectBtn" class="ws-side-add" type="button" title="鏂板缓椤圭洰" aria-label="鏂板缓椤圭洰">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="newProjectRow" class="ws-newproj-row">
                <input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="椤圭洰鍚嶇О">
                <button id="newProjectConfirm" class="ws-mini-btn primary" type="button" title="纭畾" aria-label="纭畾"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
                <button id="newProjectCancel" class="ws-mini-btn" type="button" title="鍙栨秷" aria-label="鍙栨秷"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>
            <div id="projectList" class="ws-project-list"></div>
            <div class="ws-side-foot">
                <button id="trashEntry" class="ws-trash-entry" type="button">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="ws-trash-label">鍥炴敹绔?/span>
                    <span id="trashBadge" class="ws-trash-badge">0</span>
                </button>
            </div>
        </aside>

        <!-- RIGHT: board -->
        <main class="ws-main">
            <div class="ws-topbar">
                <div class="ws-topbar-left">
                    <div id="boardProjectName" class="ws-board-name">榛樿椤圭洰</div>
                    <span id="boardCanvasCount" class="ws-board-count">0</span>
                </div>
                <div class="ws-topbar-right">
                    <button id="pasteCanvasBtn" class="ws-paste-btn" type="button" title="绮樿创鍒版椤圭洰" style="display:none"><i data-lucide="clipboard-paste" class="w-4 h-4"></i><span>绮樿创鍒版椤圭洰</span></button>
                    <button id="boardResetView" class="ws-icon-btn" type="button" title="閲嶇疆瑙嗗浘" aria-label="閲嶇疆瑙嗗浘"><i data-lucide="locate-fixed" class="w-4 h-4"></i></button>
                    <button id="boardRefresh" class="ws-icon-btn" type="button" title="鍒锋柊" aria-label="鍒锋柊"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    <button id="openFolderBtn" class="ws-icon-btn has-label" type="button" onclick="openFolder('canvases')" title="鎵撳紑鐢诲竷鏂囦欢澶? aria-label="鎵撳紑鐢诲竷鏂囦欢澶?><i data-lucide="folder-open" class="w-4 h-4"></i><span>鏂囦欢澶?/span></button>
                    <button id="importCanvasBtn" class="ws-icon-btn has-label" type="button" onclick="triggerImportCanvas()" title="瀵煎叆鐢诲竷" aria-label="瀵煎叆鐢诲竷"><i data-lucide="upload" class="w-4 h-4"></i><span>瀵煎叆</span></button>
                    <button id="newCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span>鏂板缓鐢诲竷</span></button>
                    <input id="importCanvasInput" type="file" accept=".json,.zip,application/json,application/zip" hidden>
                </div>
            </div>

            <!-- Board (pan/zoom) -->
            <div id="board" class="ws-board">
                <div id="boardWorld" class="ws-board-world"></div>
                <div id="boardEmptyHint" class="ws-board-empty">
                    <div class="ws-board-empty-icon"><i data-lucide="mouse-pointer-click" class="w-7 h-7"></i></div>
                    <div class="ws-board-empty-text">鏆傛棤鐢诲竷</div>
                    <div class="ws-board-empty-sub">涓哄綋鍓嶉」鐩垱寤虹涓€鍧楃敾甯?/div>
                    <div class="ws-board-empty-actions">
                        <button id="emptyCreateCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span>鏂板缓鐢诲竷</span></button>
                    </div>
                </div>
            </div>

            <!-- Trash panel (overlay over the board area) -->
            <div id="trashPanel" class="ws-trash-panel">
                <div class="ws-trash-head">
                    <div class="ws-trash-head-title"><i data-lucide="trash-2" class="w-4 h-4"></i><span>鍥炴敹绔?/span></div>
                    <button id="trashClose" class="ws-icon-btn" type="button" title="鍏抽棴" aria-label="鍏抽棴"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="ws-trash-note"><i data-lucide="info" class="w-3.5 h-3.5"></i><span>鍥炴敹绔欎腑鐨勭敾甯冧細鍦?30 澶╁悗鑷姩娓呯悊銆?/span></div>
                <div id="trashList" class="ws-trash-list"></div>
            </div>

            <div id="boardStatus" class="ws-status"></div>
        </main>
    </div>
    <script src="/static/js/canvas-list.js?v=2026.08.06.6"></script>
</body>
</html>
